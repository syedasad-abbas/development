apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  namespace: voip-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
        - name: nodejs-app
          # replace with your actual registry/repo:tag
          image: my-custom-node:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nodejs-app-config
          # no ports exposed; this app only initiates outbound connections
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
